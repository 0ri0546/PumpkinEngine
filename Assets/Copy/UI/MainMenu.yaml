canvas:
  name: MainHUD
  referenceResolution: { width: 1920, height: 1080 }
  scaleMode: fit

textures:
  - id: logo
    path: assets/ui/logo.png

fonts:
  - id: arial
    path: assets/fonts/Arial.ttf
    size: 16

elements:
  # Logo en haut au centre
  - type: Image
    id: hud_logo
    texture: logo
    anchor: top-right
    position: { x: -10, y: 0 }
    size: { width: 120, height: 120 }

  # Texte d'ambiance
  - type: Text
    id: game_title
    text: "KINGDOM OF PUMPKIN"
    font: arial
    color: [245, 235, 215, 255]
    anchor: top-center
    position: { x: 0, y: 0 }

  # Bouton principal
  - type: Button
    id: play_button
    anchor: top-left
    position: { x: 3, y: 3 }
    size: { width: 260, height: 65 }
    text: "JOUER"
    normalColor: [35, 35, 35, 220]
    hoveredColor: [75, 75, 75, 245]
    pressedColor: [20, 20, 20, 255]
    disabledColor: [35, 35, 35, 180]
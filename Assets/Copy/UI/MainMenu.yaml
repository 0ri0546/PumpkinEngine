canvas:
  name: MainMenu
  referenceResolution: { width: 1920, height: 1080 }
  scaleMode: fit

textures:
  - id: logo
    path: assets/ui/logo.png

fonts:
  - id: body_font
    path: assets/fonts/Arial.ttf
    size: 24

elements:
  - type: Image
    id: test_image
    texture: logo
    anchor: center
    position: { x: 0, y: -100 }
    size: { width: 256, height: 128 }

  - type: Text
    id: test_text
    text: "Hello World"
    font: body_font
    color: [255, 255, 255, 255]
    anchor: center
    position: { x: 0, y: 100 }
